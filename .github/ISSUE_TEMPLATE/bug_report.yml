name: Bug Report
description: Report a bug in @bodanglin/verdict-node
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.
  - type: input
    id: version
    attributes:
      label: Package Version
      description: What version of @bodanglin/verdict-node are you using?
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node.js Version
      description: What Node.js version?
      placeholder: "20.x"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: Code snippet or steps to reproduce
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Forwarder middleware (SSE/non-stream)
        - Validator middleware (Zod schemas)
        - LlmGateNode
        - Contract types
        - Types/Build
        - Tests
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues
          required: true
        - label: I am using the latest version
          required: true
